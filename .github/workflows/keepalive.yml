name: Keep ERP backend warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Warm backend — health + key data endpoints
        run: |
          BASE="https://silaa-website.vercel.app/api/erp"
          for path in health styles-with-variants sales-orders expenses proforma-invoices; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$BASE/$path")
            echo "$path: $status"
          done
      - name: Warm ERP frontend routes
        run: |
          BASE="https://erp.silacollective.in"
          for path in "" /sales-orders /proforma-invoices /expenses /styles; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$BASE$path")
            echo "erp$path: $status"
          done
